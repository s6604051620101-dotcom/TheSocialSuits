<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยืนยันการสั่งซื้อ | TheSocialsuits</title>
  <meta name="description" content="กรอกข้อมูลเพื่อยืนยันการสั่งซื้อชุดสูทจาก TheSocialsuits">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">TheSocialsuits</a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
    </div>
  </header>

  <section class="section order-section">
    <div class="container">
      <div class="order-wrap">

        <div class="section-title" style="margin-bottom: var(--space-md); text-align: left;">
          <span class="eyebrow">ขั้นตอนสุดท้าย</span>
          <h1 style="font-size: clamp(2rem, 4vw, 2.8rem);">ยืนยันการสั่งซื้อ</h1>
          <p style="margin-top: var(--space-xs);">กรอกข้อมูลติดต่อของคุณ ทีมงานจะรีบติดต่อกลับเพื่อยืนยันไซส์และนัดหมายโดยเร็วที่สุด</p>
        </div>

        <form id="orderForm" class="order-form" novalidate>

          <div class="order-summary">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" readonly>

            <label for="total">ยอดรวม (บาท)</label>
            <input type="text" id="total" name="total" readonly>
          </div>

          <div class="form-field">
            <label for="customerName">ชื่อ-นามสกุล</label>
            <input type="text" id="customerName" name="customerName" placeholder="เช่น สมชาย ใจดี" required>
          </div>

          <div class="form-field">
            <label for="contact">เบอร์โทร / LINE ID</label>
            <input type="text" id="contact" name="contact" placeholder="เช่น 08X-XXX-XXXX หรือ @thesocialsuits" required>
          </div>

          <div class="form-field">
            <label for="note">หมายเหตุเพิ่มเติม</label>
            <textarea id="note" name="note" rows="4" placeholder="เช่น วันที่ต้องการใช้งาน, ความสูง/น้ำหนัก, ข้อความอื่น ๆ"></textarea>
          </div>

          <button type="submit" class="btn btn-primary order-submit">ยืนยันสั่งซื้อ</button>

        </form>

      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="logo">TheSocialsuits</div>
      <div class="footer-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </div>
      <p class="footer-note">&copy; 2026 TheSocialsuits. สงวนลิขสิทธิ์.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
